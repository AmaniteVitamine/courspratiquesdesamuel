<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Ouverture du document… | Maths pratiques de Samuel</title>
  <link rel="icon" href="../images/logotop.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" crossorigin>
  <link rel="stylesheet" href="./lecteur.css">
</head>
<body>
  <main class="document-screen">
    <div class="reader-loading" id="reader-loading" role="status" aria-live="polite">
      <span class="reader-spinner" aria-hidden="true"></span>
      <span>Ouverture du PDF…</span>
    </div>
    <iframe id="reader-viewer" title="Document" referrerpolicy="no-referrer" hidden></iframe>
    <img id="reader-image" alt="Document" hidden>
    <div id="reader-error" class="reader-error" role="alert" hidden>
      <p id="reader-error-text">Document indisponible.</p>
      <a href="./">Retour à l’espace élève</a>
    </div>
    <div id="reader-fallback" class="reader-fallback" hidden>
      <a id="reader-direct-link" href="#" target="_blank" rel="noopener noreferrer">Le PDF ne s’affiche pas ? Ouvrir dans le navigateur</a>
    </div>
  </main>
  <script src="./config.js"></script>
  <script type="module" src="./lecteur.js"></script>
</body>
</html>
